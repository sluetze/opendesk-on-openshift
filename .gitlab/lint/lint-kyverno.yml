---
include:
  - local: "/.gitlab/lint/lint-common.yml"

helmfile-template:
  allow_failure: false
  artifacts:
    paths:
      - "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml"
    expire_in: "1 day"
  extends: ".lint-common"
  image: "${OPENDESK_LINT_IMAGE}"
  parallel:
    matrix: &matrix
      - APP:
          - "collabora"
          - "cryptpad"
          - "element"
          - "jitsi"
          - "nextcloud"
          - "notes"
          - "nubus"
          - "open-xchange"
          - "opendesk-migrations-post"
          - "opendesk-migrations-pre"
          - "opendesk-openproject-bootstrap"
          - "opendesk-services"
          - "openproject"
          - "services-external"
          - "xwiki"
  script:
    - >
      pushd "${CI_PROJECT_DIR}/helmfile/apps/${APP}"
    - >
      node /app/opendesk-ci-cli/src/index.js generate-kyverno-env
      -d ${CI_PROJECT_DIR}/helmfile/environments
      -x ${CI_PROJECT_DIR}/.kyverno/_overwrite.yaml
    - "popd"
    - >
      printf 'apps:\n  notes:\n    enabled: true\n'
      > "${CI_PROJECT_DIR}/helmfile/environments/test/apps.yaml.gotmpl"
    - >
      helmfile template
      -f "${CI_PROJECT_DIR}/helmfile/apps/${APP}/helmfile.yaml.gotmpl"
      -e test
      --include-needs
      --skip-tests
      > "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml"
    - >
      test -s "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml"
      || { echo "ERROR: helmfile rendered an empty manifest for '${APP}'.
      Is the app enabled in the 'test' environment?"; exit 1; }

helmfile-template-diff:
  allow_failure: true
  extends: ".lint-common"
  image: "${OPENDESK_LINT_IMAGE}"
  needs:
    - job: "helmfile-template"
      artifacts: true
      parallel:
        matrix:
          - APP: ["$[[ matrix.APP ]]"]
  parallel:
    matrix: *matrix
  rules:
    - if: "$CI_COMMIT_BRANCH !~ 'develop|main'"
  script:
    - "git fetch"
    - "git checkout develop"
    - >
      pushd "${CI_PROJECT_DIR}/helmfile/apps/${APP}"
    - >
      node /app/opendesk-ci-cli/src/index.js generate-kyverno-env
      -d ${CI_PROJECT_DIR}/helmfile/environments
      -x ${CI_PROJECT_DIR}/.kyverno/_overwrite.yaml
    - "popd"
    - >
      printf 'apps:\n  notes:\n    enabled: true\n'
      > "${CI_PROJECT_DIR}/helmfile/environments/test/apps.yaml.gotmpl"
    - >
      helmfile template
      -f "${CI_PROJECT_DIR}/helmfile/apps/${APP}/helmfile.yaml.gotmpl"
      -e test
      --include-needs
      --skip-tests
      > "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}-develop.yaml"
    - >
      diff "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml" "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}-develop.yaml"
    - >
      cmp "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml" "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}-develop.yaml"
  variables:
    GIT_STRATEGY: "clone"

lint-kyverno-required:
  allow_failure: false
  extends: ".lint-common"
  image: "${OPENDESK_LINT_IMAGE}"
  needs:
    - job: "helmfile-template"
      artifacts: true
      parallel:
        matrix:
          - APP: ["$[[ matrix.APP ]]"]
  parallel:
    matrix: *matrix
  script:
    - >
      mv "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml" "${CI_PROJECT_DIR}/.kyverno/opendesk.yaml"
    - >
      pushd "${CI_PROJECT_DIR}/helmfile/apps/${APP}"
    - >
      node /app/opendesk-ci-cli/src/index.js remove-empty-keys
      -f ${CI_PROJECT_DIR}/.kyverno/opendesk.yaml
    - "popd"
    - >
      pushd "${CI_PROJECT_DIR}/.kyverno"
    - >
      node /app/opendesk-ci-cli/src/index.js generate-kyverno-tests
      -d ${CI_PROJECT_DIR}/.kyverno
      -t required
      -s manifest
      -f opendesk.yaml
      --skip-tests true
      ${APP}
    - >
      ! grep -q "^results: \[\]" kyverno-test.yaml
      || { echo "ERROR: no Kyverno tests were generated for '${APP}'."; exit 1; }
    - "kyverno test ."
    - "popd"

# The "preferable" (optional) policy set runs in two jobs sharing this base:
# apps that already satisfy the whole set are listed in
# `lint-kyverno-prefereable-enforced` and hard-fail on regressions, the rest
# stay in `lint-kyverno-prefereable` as non-blocking warnings. When an app's
# warnings reach zero, move it from the warning matrix to the enforced one.
.lint-kyverno-prefereable-base:
  extends: ".lint-common"
  image: "${OPENDESK_LINT_IMAGE}"
  needs:
    - job: "helmfile-template"
      artifacts: true
      parallel:
        matrix:
          - APP: ["$[[ matrix.APP ]]"]
  script:
    - >
      mv "${CI_PROJECT_DIR}/.kyverno/opendesk-${APP}.yaml" "${CI_PROJECT_DIR}/.kyverno/opendesk.yaml"
    - >
      pushd "${CI_PROJECT_DIR}/helmfile/apps/${APP}"
    - >
      node /app/opendesk-ci-cli/src/index.js remove-empty-keys
      -f ${CI_PROJECT_DIR}/.kyverno/opendesk.yaml
    - "popd"
    - >
      pushd "${CI_PROJECT_DIR}/.kyverno"
    - >
      node /app/opendesk-ci-cli/src/index.js generate-kyverno-tests
      -d ${CI_PROJECT_DIR}/.kyverno
      -t optional
      -s manifest
      -f opendesk.yaml
      --skip-tests true
      ${APP}
    - >
      ! grep -q "^results: \[\]" kyverno-test.yaml
      || { echo "ERROR: no Kyverno tests were generated for '${APP}'."; exit 1; }
    - "kyverno test ."
    - "popd"

lint-kyverno-prefereable:
  allow_failure: true
  extends: ".lint-kyverno-prefereable-base"
  parallel:
    matrix:
      - APP:
          - "element"
          - "notes"
          - "open-xchange"
          - "openproject"
          - "services-external"

lint-kyverno-prefereable-enforced:
  allow_failure: false
  extends: ".lint-kyverno-prefereable-base"
  parallel:
    matrix:
      - APP:
          - "collabora"
          - "cryptpad"
          - "jitsi"
          - "nextcloud"
          - "nubus"
          - "opendesk-migrations-post"
          - "opendesk-migrations-pre"
          - "opendesk-openproject-bootstrap"
          - "opendesk-services"
          - "xwiki"
...
