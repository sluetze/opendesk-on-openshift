# SPDX-License-Identifier: Apache-2.0
#
# Routes OpenShift's Ingress-to-Route converter never creates, because it silently
# drops any Ingress rule with pathType: Exact (only Prefix/ImplementationSpecific
# get converted). openDesk's nubusPortalFrontend/nubusPortalServer/UMC-gateway
# charts use Exact for the portal root page and several JSON/JS bootstrap assets.
# See docs/openshift-errors.md for the 1.19.1 investigation.
#
# Each Route mirrors the backend Service+port the dropped Ingress rule already
# specified. TLS uses Route.spec.tls.externalCertificate -> Secret
# opendesk-certificates-tls (BYO Option 1) so the private key is never embedded
# in this manifest. Requires the companion Role/RoleBinding that lets
# openshift-ingress:router read that Secret (see opendesk-00-router-tls-secret-rbac.yaml).
# Apply after the BYO TLS Secret exists (or re-apply once it does).
# portalHost placeholder replaced by site overlay configMapGenerator.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: opendesk-fix-portal-root
spec:
  host: portal.example.invalid
  path: /
  port:
    targetPort: http
  tls:
    externalCertificate:
      name: opendesk-certificates-tls
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: ums-portal-frontend
    weight: 100
  wildcardPolicy: None
---
