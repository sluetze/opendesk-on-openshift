apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: opendesk-anyuid-seccomp
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
# collabora-online hardcodes allowPrivilegeEscalation:true + CHOWN/FOWNER/
# SYS_CHROOT (LibreOffice-based sandboxing needs chroot/chown/fowner) -- see
# docs/openshift-errors.md failure #7. dovecot and postfix/postfix-ox add
# DAC_OVERRIDE/KILL/NET_BIND_SERVICE/SETGID/SETUID on top (mail backend needs
# to bind port 25/143 as root then setuid/setgid to the mail user, plus
# DAC_OVERRIDE/CHOWN for maildir ownership) -- see
# docs/security-context.md's compliance table and
# docs/openshift-errors.md failure #10. jitsi-jibri hardcodes SYS_ADMIN
# (Chromium/FFmpeg recording sandbox) -- see docs/openshift-errors.md
# failure #13. jitsi web/prosody/jicofo/jvb need CHOWN/SETGID/SETUID requested
# via helm customization (SCC already allowed those; pods had capabilities: {}
# under requiredDropCapabilities:[ALL]) -- same failure #13. Not exposed as a
# helm value on the SCC side.
allowedCapabilities:
- CHOWN
- DAC_OVERRIDE
- FOWNER
- KILL
- NET_BIND_SERVICE
- SETGID
- SETUID
- SYS_ADMIN
- SYS_CHROOT
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities:
- ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
- runtime/default
supplementalGroups:
  type: RunAsAny
priority: 10
groups:
- system:serviceaccounts:opendesk
users: []
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- persistentVolumeClaim
- projected
- secret
