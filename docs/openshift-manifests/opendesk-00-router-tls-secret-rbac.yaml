# SPDX-License-Identifier: Apache-2.0
#
# Filename prefix `00-` so `oc apply -f docs/openshift-manifests/` creates this
# RoleBinding before Routes that use externalCertificate (alphabetic order).
#
# OpenShift Route.spec.tls.externalCertificate requires the ingress router
# ServiceAccount to read the referenced TLS Secret. Without this RBAC the
# Route stays admitted but serves the default router cert (wrong SANs for
# *.opendesk.apps...). See docs/openshift-deployment.md (TLS) and
# docs/openshift-legacy-selfsigned-ca/option-2a-to-byo-migration.md.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opendesk-router-tls-secret-reader
  namespace: opendesk
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opendesk-certificates-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opendesk-router-tls-secret-reader
  namespace: opendesk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opendesk-router-tls-secret-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
